name: Check and publish

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: App links file is valid JSON
        run: python3 -m json.tool .well-known/apple-app-site-association > /dev/null
      - name: Lists only add to what's published
        run: |
          swiftc -O tools/ListsFile.swift tools/main.swift -o check
          if [ -f lists.json ]; then
            code=$(curl -s -o published.json -w '%{http_code}' https://tf997.github.io/lists.json)
            if [ "$code" = "200" ]; then ./check published.json lists.json
            elif [ "$code" = "404" ]; then ./check none lists.json
            else echo "Couldn't fetch the published lists ($code)"; exit 1; fi
          fi

  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Leave out the tools
        run: rm -rf tools .github published.json README.md
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v4
