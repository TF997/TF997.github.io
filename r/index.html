<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#112F2C">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self'">
<title>A book for you</title>
<meta property="og:title" content="A book for you">
<meta property="og:site_name" content="Readthroughs">
<meta property="og:image" content="https://tf997.github.io/r/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100svh;color:#fff;background:#112F2C radial-gradient(90% 46% at 88% 34%,#1A403B,#112F2C) no-repeat;
font:17px/1.4 -apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;align-items:center;text-align:center;
padding:max(28px,env(safe-area-inset-top)) 24px 0}
.mark{display:flex;align-items:center;gap:8px;color:#FBE6A0;font-weight:700}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 0;max-width:420px;width:100%}
#cover{width:min(190px,48vw,26svh);border-radius:12px;overflow:hidden;transform:rotate(-3deg);box-shadow:0 22px 44px rgba(0,0,0,.45);line-height:0}
#cover svg{width:100%;height:auto;display:block}
h1{font-size:32px;line-height:1.15;margin:32px 0 0;overflow-wrap:anywhere}
#author{opacity:.7;font-weight:500;margin:4px 0 0}
nav{position:sticky;bottom:0;width:100%;max-width:420px;padding:16px 0 max(20px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;
background:linear-gradient(transparent,#112F2C 28%)}
a{height:54px;border-radius:27px;display:flex;align-items:center;justify-content:center;font-weight:600;text-decoration:none}
#open{background:#FBE6A0;color:#112F2C}
#get{background:#2F4A47;color:#fff}
a:focus-visible{outline:3px solid #fff;outline-offset:3px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="mark"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4.5L6 21Z" fill="#FBE6A0"/></svg>Readthroughs</div>
<main>
<div id="cover" aria-hidden="true"></div>
<h1 id="title"></h1>
<p id="author"></p>
</main>
<nav>
<a id="open" hidden>Open in Readthroughs</a>
<a id="get" hidden>Get Readthroughs</a>
</nav>
<script>
// Where to get the app.
const GET_APP = "https://testflight.apple.com/join/nKcJFmrU";

// The recommendation is all in the part after the #, which is never sent to the server.
async function read(payload) {
  const base64 = payload.replace(/-/g, "+").replace(/_/g, "/");
  const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
  return JSON.parse(await new Response(stream).text());
}

const HUES = [214, 18, 160, 40, 336, 124, 250, 2];

function drawCover(title) {
  let seed = 2166136261;
  for (const c of title) { seed ^= c.codePointAt(0); seed = Math.imul(seed, 16777619) >>> 0; }
  const pick = n => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return Math.floor(seed / 4294967296 * n); };
  const h = HUES[pick(HUES.length)], color = (l, s = 55, turn = 0) => `hsl(${(h + turn + 360) % 360} ${s}% ${l}%)`;
  const bg = color(34), far = color(44), mid = color(26), near = color(14), sun = "#FFF3D6", pop = color(58, 52, 14);
  const scenes = [
    () => `<circle cx="${34 + pick(32)}" cy="66" r="9" fill="${sun}"/><path d="M0 100Q30 78 60 94T100 88V150H0Z" fill="${far}"/><path d="M0 118Q26 98 56 112T100 108V150H0Z" fill="${pop}"/><path d="M0 134Q34 118 64 130T100 126V150H0Z" fill="${near}"/>`,
    () => `<circle cx="56" cy="62" r="8" fill="${sun}"/><path d="M52 138V92a18 18 0 0 1 36 0v46Z" fill="${mid}"/><path d="M14 138V98a16 16 0 0 1 32 0v40Z" fill="${pop}"/><path d="M22 138v-34a8 8 0 0 1 16 0v34Z" fill="${near}"/><path d="M0 134H100V150H0Z" fill="${near}"/>`,
    () => `<circle cx="${30 + pick(40)}" cy="62" r="8" fill="${sun}"/><path d="M0 126L30 78 58 120 78 92 100 122V150H0Z" fill="${far}"/><path d="M0 140L22 112 48 138 72 110 100 136V150H0Z" fill="${pop}"/><path d="M0 146L34 130 66 146 100 132V150H0Z" fill="${near}"/>`,
    () => [38, 29, 20, 11].map((r, i) => `<circle cx="50" cy="98" r="${r}" fill="${[mid, far, pop, sun][i]}"/>`).join("") + `<path d="M0 136Q25 126 50 136T100 134V150H0Z" fill="${near}"/>`,
  ];
  const words = title.toUpperCase().split(/\s+/), lines = [];
  const size = Math.max(6, Math.min(15, 86 / Math.max(...words.map(w => w.length)) / 0.72));
  for (const word of words) {
    const last = lines[lines.length - 1];
    if (last && (last + " " + word).length * size * 0.72 <= 88) lines[lines.length - 1] += " " + word; else lines.push(word);
  }
  const ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", "0 0 100 150");
  svg.innerHTML = `<rect width="100" height="150" fill="${bg}"/>${scenes[pick(scenes.length)]()}`;
  lines.slice(0, 4).forEach((line, i) => {
    const text = document.createElementNS(ns, "text");
    for (const [k, v] of Object.entries({ x: 50, y: 10 + size + i * size * 1.12, "text-anchor": "middle", fill: "#fff", "font-size": size,
      "font-weight": 700, "font-family": "ui-serif, Georgia, serif" })) text.setAttribute(k, v);
    text.textContent = line;
    svg.append(text);
  });
  document.getElementById("cover").replaceChildren(svg);
}

async function show() {
  const set = (id, text) => { const e = document.getElementById(id); e.textContent = text; e.hidden = !text; };
  const get = document.getElementById("get"), open = document.getElementById("open"), cover = document.getElementById("cover");
  if (GET_APP) { get.href = GET_APP; get.hidden = false; }
  const payload = location.hash.slice(1);
  open.hidden = true;
  cover.hidden = true;
  for (const id of ["title", "author"]) set(id, "");
  try {
    if (!/^[A-Za-z0-9_-]+$/.test(payload)) throw new Error("empty");
    const { book } = await read(payload);
    if (typeof book.title !== "string" || !book.title) throw new Error("no book");
    set("title", book.title);
    set("author", String(book.author || ""));
    document.title = book.title;
    cover.hidden = false;
    drawCover(book.title);
    open.href = "readthroughs://recommend?d=" + payload;
    open.hidden = false;
  } catch {
    set("title", "This link is incomplete");
  }
}
addEventListener("hashchange", show);
show();
</script>
</body>
</html>
